<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rwanda SDI Hub chat</title>
<style>
  :root { --c-main:#0b4f8a; --c-main-d:#083c69; --c-accent:#f2b705; --c-text:#1d2a36; --c-line:#dde3e9; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; font:14px/1.4 system-ui, "Segoe UI", sans-serif; color:var(--c-text); }
  button { font:inherit; cursor:pointer; }
  #launch { position:absolute; right:9px; bottom:9px; width:58px; height:58px; border:0; border-radius:50%;
    background:var(--c-main); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(11,79,138,.4); }
  #launch:hover { background:var(--c-main-d); }
  #launch svg { width:26px; height:26px; fill:currentColor; }
  #panel { position:absolute; inset:10px; display:none; flex-direction:column; background:#fff; border-radius:10px;
    overflow:hidden; box-shadow:0 12px 36px rgba(0,0,0,.28); }
  body.open #panel { display:flex; }
  body.open #launch { display:none; }
  .head { background:var(--c-main); color:#fff; padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:3px solid var(--c-accent); }
  .title { margin:0; font-size:15px; font-weight:600; line-height:1.2; }
  .sub { margin:2px 0 0; font-size:12px; opacity:.85; }
  #close { background:none; border:0; color:#fff; font-size:24px; line-height:1; padding:4px 8px; }
  .log { flex:1; overflow-y:auto; padding:14px; background:#f5f7f9; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:8px 12px; border-radius:12px; background:#fff; border:1px solid var(--c-line);
    white-space:pre-wrap; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:var(--c-main); color:#fff; border-color:var(--c-main); }
  .msg.bot { align-self:flex-start; }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--c-line); background:#fff; margin:0; }
  input { flex:1; min-width:0; border:1px solid var(--c-line); border-radius:20px; padding:8px 14px; font:inherit; }
  #send { border:0; border-radius:20px; background:var(--c-main); color:#fff; padding:0 16px; }
  #send:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--c-accent); outline-offset:2px; }
</style>
</head>
<body>
<button id="launch" aria-label="Open chat" title="Chat with Rwanda SDI Hub">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
</button>

<section id="panel" role="dialog" aria-label="Rwanda SDI Hub chat">
  <header class="head">
    <div>
      <h2 class="title">Rwanda SDI Hub</h2>
      <p class="sub">Ask about maps, plans or data</p>
    </div>
    <button id="close" type="button" aria-label="Close chat">&times;</button>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Type your question" aria-label="Your message" required>
    <button id="send" type="submit">Send</button>
  </form>
</section>

<script>
const CONFIG = {
  backend: "",
  greeting: "Hello! How can I help you find geospatial data or plans today?"
};

const $ = id => document.getElementById(id);
const log = $("log"), form = $("form"), input = $("input"), send = $("send");

function tell(open) { try { parent.postMessage({ type: "rsdi-chat", open }, "*"); } catch (e) {} }

let greeted = false;
function setOpen(open) {
  document.body.classList.toggle("open", open);
  tell(open);
  if (open) {
    if (!greeted) { add(CONFIG.greeting, "bot"); greeted = true; }
    input.focus();
  } else {
    $("launch").focus();
  }
}
$("launch").onclick = () => setOpen(true);
$("close").onclick = () => setOpen(false);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("open")) setOpen(false); });

if (new URLSearchParams(location.search).get("open") === "1") setOpen(true);

// When the host page shrinks this frame back to just the icon, tuck the panel away (the conversation stays)
window.addEventListener("resize", () => {
  if (window.innerWidth < 200 && document.body.classList.contains("open")) {
    document.body.classList.remove("open");
    tell(false);
  }
});

function add(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function getReply(text) {
  if (!CONFIG.backend) {
    await new Promise(r => setTimeout(r, 600));
    return "Thanks for your message. This chat is not yet connected to a backend.";
  }
  const res = await fetch(CONFIG.backend, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return data.reply || "Sorry, I have no answer for that.";
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add(text, "me");
  input.value = "";
  send.disabled = true;
  getReply(text)
    .then(reply => add(reply, "bot"))
    .catch(() => add("Sorry, something went wrong. Please try again.", "bot"))
    .then(() => { send.disabled = false; input.focus(); });
});
</script>
</body>
</html>
