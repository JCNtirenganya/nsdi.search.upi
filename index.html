<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land use by UPI</title>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<style>
  :root { --ink:#1d2b2a; --muted:#5e6f6d; --line:#d5dedc; --accent:#0f6b5e; --accent-d:#0a4f45; --bg:#ffffff; --soft:#f3f7f6; --warn:#9a3412; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:transparent; }
  .wrap { position:fixed; right:12px; bottom:12px; z-index:11; }
  button { font:inherit; cursor:pointer; border-radius:6px; border:0; }
  #open { width:58px; height:58px; padding:0; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(15,107,94,.35); }
  #open svg { width:26px; height:26px; fill:currentColor; }
  #open:hover, #go:hover { background:var(--accent-d); }
  button:focus-visible, input:focus-visible { outline:3px solid #7cc5b8; outline-offset:2px; }
  #overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:flex-end; justify-content:flex-end; padding:12px 12px 82px; background:transparent; }
  #overlay[hidden] { display:none; }
  #panel { position:relative; width:100%; max-width:360px; max-height:100%; overflow:auto; padding:16px 16px 14px; text-align:left;
    background:#f3f7f6; border:1px solid #cfdcd9; border-left:5px solid #9fbdb7; border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.3);
    transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease; }
  #panel:hover { background:#e9f2f0; border-color:var(--accent); box-shadow:0 8px 24px rgba(15,107,94,.18), 0 12px 40px rgba(0,0,0,.25); transform:translateY(-3px); }
  #close { position:absolute; top:6px; right:6px; width:32px; height:32px; background:transparent; color:var(--muted); font-size:22px; line-height:1; }
  #close:hover { background:#dce9e6; color:var(--ink); }
  h1 { font-size:15px; margin:0 0 10px; padding-right:30px; }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:5px; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  #go { background:var(--accent); color:#fff; padding:8px 14px; font-weight:600; }
  #go:disabled { opacity:.6; cursor:wait; }
  #out:empty { display:none; }
  #out { margin-top:12px; }
  .msg { color:var(--muted); }
  .err { color:var(--warn); }
  h2 { font-size:16px; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .zone { padding:8px 0; border-top:1px solid var(--line); }
  .zone .top { display:flex; justify-content:space-between; gap:12px; font-weight:600; }
  .zone .sub { color:var(--muted); font-size:13px; }
  .bar { height:8px; background:#dfe9e7; border-radius:4px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .zone.un .bar i { background:#a8b5b3; }
  .mapbtn { display:block; margin-top:14px; padding:9px 14px; text-align:center; text-decoration:none; font-weight:600; color:var(--accent) !important; border:2px solid var(--accent); border-radius:6px; }
  .mapbtn:hover { background:var(--accent); color:#fff !important; }
  @media (prefers-reduced-motion: reduce) { #panel { transition:none; } #panel:hover { transform:none; } }
  /* Full-page mode (?open=1): no launcher icon, panel open at the top and centred, no close button */
  .page .wrap, .page #close { display:none; }
  .page #overlay { align-items:flex-start; justify-content:center; padding:12px; }
  .note { margin-top:10px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <button id="open" aria-haspopup="dialog" aria-label="Check land use by UPI" title="Check land use by UPI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg></button>
</div>
<div id="overlay" hidden>
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="ttl">
    <button id="close" aria-label="Close">&times;</button>
    <h1 id="ttl">Land use by UPI</h1>
    <label for="upi">Parcel UPI</label>
    <div class="row">
      <input id="upi" type="text" placeholder="e.g. 1/02/03/04/0005" autocomplete="off">
      <button id="go">Search</button>
    </div>
    <div id="out" aria-live="polite"></div>
  </div>
</div>

<script>
/* ============ CONFIGURE THESE ============ */
const COMMON = {
  minPercent: 0.1,     // pieces smaller than this are treated as topology slivers
  target: "_blank"     // "View on map": "_blank" = new tab, "_top" = replace the whole page
};

// The UPI prefix decides which site is searched. If a UPI matches no prefix, every site is searched.
// Give either a direct layer URL (ending in /FeatureServer/0) or an ArcGIS item ID + layer number.
const SITES = [
  {
    key: "kigali", name: "Kigali",
    upiPrefix: "1/",           // Kigali UPIs start with 1/
    portal: "https://masterplan.kigalicity.gov.rw/portal",
    parcels: { url: "https://masterplan.kigalicity.gov.rw/server/rest/services/Hosted/KigaliParcels_withZoning/FeatureServer/0" },
    plan:    { url: "https://masterplan.kigalicity.gov.rw/server/rest/services/Masterplan2020/Zoning_Phases_22Apr2026/FeatureServer/0" },
    upiField: "upi",
    zoneField: "new_zoning",   // full zone name, e.g. "R1-Low density residential zone"
    useField: "",              // no separate land use field; the zone name carries it
    map: {                     // Web AppBuilder app
      type: "wab",
      url: "https://masterplan.kigalicity.gov.rw/portal/apps/webappviewer/index.html?id=fdd2e30cbc15401d9daee5f68982d755",
      layerId: "",             // OPTIONAL: id of the parcel layer in the app's web map. Blank = auto-detect
      select: true,            // zoom to + highlight the parcel using the UPI query parameter
      marker: true             // fallback marker, used only when the parcel layer id can't be found
    }
  },
  {
    key: "muhanga", name: "Muhanga",
    upiPrefix: "2/07/",        // Muhanga UPIs start with 2/07/
    portal: "https://rla.maps.arcgis.com",
    parcels: { itemId: "ebb24769dfdf4f24b18e0f8bb5569f2f", layer: 0 },   // Muhanga_Parcels
    plan:    { itemId: "a0af647bc8dc43398f39e7e5d5987cda", layer: 0 },   // Muhanga_DLUP
    upiField: "UPI",
    zoneField: "Zoning",
    useField: "",              // no separate land use field; the Zoning field carries it
    map: {                     // Experience Builder app
      type: "exp",
      url: "https://experience.arcgis.com/experience/19333efca3744cf3ab27ba4da073d49f",
      widgetId: "widget_7",    // map widget ID (from the app URL). Blank = auto-detect; comma-separate several IDs if needed
      select: true,            // select (highlight) the parcel in the app
      marker: true,            // fallback marker, used only when no parcel data source could be found
      dataSourceId: ""         // OPTIONAL override: parcel layer data source ID(s) in the app, comma-separated
    }
  }
];
/* ========================================= */

// Resolve each layer's REST URL (from a direct URL or an ArcGIS item ID), cached, and read its field list
const layerCache = {};
async function getLayer(site, kind) {
  const ck = site.key + "_" + kind;
  if (layerCache[ck]) return layerCache[ck];
  try { const c = JSON.parse(localStorage.getItem("lu_" + ck)); if (c && c.url && Date.now() - (c.t || 0) < 864e5) return (layerCache[ck] = c); } catch (e) {}
  const def = site[kind];
  let url = def.url;
  if (!url) {
    const r = await fetch(`${site.portal}/sharing/rest/content/items/${def.itemId}?f=json`);
    const meta = await r.json();
    if (meta.error || !meta.url) throw new Error(`Could not read the ${site.name} ${kind} item. Make sure it is shared publicly`);
    url = /\/\d+$/.test(meta.url) ? meta.url : meta.url.replace(/\/$/, "") + "/" + (def.layer ?? 0);
  }
  const info = await (await fetch(url + "?f=json")).json();
  if (info.error) throw new Error(`${site.name} ${kind} layer is not accessible (${info.error.message || "error"}). Make sure it is shared publicly`);
  layerCache[ck] = { t: Date.now(), url, fields: (info.fields || []).map(f => f.name) };
  try { localStorage.setItem("lu_" + ck, JSON.stringify(layerCache[ck])); } catch (e) {}
  return layerCache[ck];
}
function pickField(layer, wanted, label) {
  const hit = layer.fields.find(f => f.toLowerCase() === wanted.toLowerCase());
  if (!hit) throw new Error(`Field "${wanted}" not found in ${label}. Available fields: ${layer.fields.join(", ")}`);
  return hit;
}

const $ = id => document.getElementById(id);
const openBtn = $("open"), overlay = $("overlay"), out = $("out"), go = $("go");

function openDlg() {
  overlay.hidden = false;
  $("upi").focus();
  SITES.forEach(s => {
    getLayer(s, "parcels").catch(() => {}); getLayer(s, "plan").catch(() => {});
    (s.map.type === "exp" ? findMapWidgets(s) : getWabLayerId(s)).catch(() => {});
  });
}
function closeDlg() { overlay.hidden = true; openBtn.focus(); }
openBtn.onclick = openDlg;
$("close").onclick = closeDlg;
overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeDlg(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closeDlg(); });
// When the host page shrinks this frame to just the icon, tuck the panel away (results stay for next time)
window.addEventListener("resize", () => { if (window.innerWidth < 200) overlay.hidden = true; });
$("upi").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
go.onclick = run;

// Full-page mode: used on the site's dedicated search page, e.g. .../nsdi.search.upi/?open=1
if (new URLSearchParams(location.search).get("open") === "1") {
  document.body.classList.add("page");
  openDlg();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = (cls, html) => { out.innerHTML = `<div class="${cls}">${html}</div>`; };

// POST avoids URL-length limits when sending a parcel geometry
async function query(layerUrl, params) {
  const body = new URLSearchParams({ f: "geojson", ...params });
  const res = await fetch(layerUrl + "/query", { method: "POST", body });
  if (!res.ok) throw new Error("Service returned HTTP " + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "Service error");
  return data;
}

function toEsriPolygon(geom) {
  const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
  return { rings: polys.flat(), spatialReference: { wkid: 4326 } };
}

const asFeature = g => turf.feature(g);
const area = f => (f ? turf.area(f) : 0);
function safe(fn) { try { return fn(); } catch (e) { console.warn(e); return null; } }
const union = (a, b) => (!a ? b : !b ? a : safe(() => turf.union(turf.featureCollection([a, b]))) || a);

async function fetchAllPlan(parcelGeom, planUrl, outFields) {
  const feats = [];
  let offset = 0;
  for (let i = 0; i < 20; i++) {
    const data = await query(planUrl, {
      where: "1=1",
      geometry: JSON.stringify(toEsriPolygon(parcelGeom)),
      geometryType: "esriGeometryPolygon",
      inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields,
      returnGeometry: "true",
      maxAllowableOffset: "0.000005",   // simplify to roughly 0.5 m: far less data to download and process
      geometryPrecision: "6",
      resultOffset: offset
    });
    feats.push(...data.features);
    const more = data.exceededTransferLimit || (data.properties && data.properties.exceededTransferLimit);
    if (!more || !data.features.length) break;
    offset += data.features.length;
  }
  return feats;
}

// ---- "View on map" link ----
// Delimiters (: , & =) stay plain; only characters inside values are encoded.
const enc = s => encodeURIComponent(s).replace(/['()!*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase());

async function getJSON(url, ms = 6000) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
  try { return await (await fetch(url, { signal: ctrl.signal })).json(); } finally { clearTimeout(t); }
}

// Parcel centre (Web Mercator) and a sensible map scale
function parcelView(parcel) {
  const [lon, lat] = turf.centroid(parcel).geometry.coordinates;
  const [minX, minY, maxX, maxY] = turf.bbox(parcel);
  const size = Math.max(turf.distance([minX, minY], [maxX, minY]), turf.distance([minX, minY], [minX, maxY])) * 1000; // metres
  const scale = Math.max(500, Math.ceil(size * 10 / 100) * 100);
  const R = 6378137;
  const x = lon * Math.PI / 180 * R;
  const y = Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * R;   // Web Mercator (102100)
  return { lon, lat, x, y, scale };
}

/* ---- Experience Builder (Muhanga) ---- */
const expCfgCache = {};
async function getExpConfig(site) {
  if (expCfgCache[site.key]) return expCfgCache[site.key];
  const m = site.map.url.match(/\/experience\/([0-9a-f]{32})/i);
  if (!m) return null;
  try { expCfgCache[site.key] = await getJSON(`${site.portal}/sharing/rest/content/items/${m[1]}/data?f=json`); }
  catch (e) { console.warn("Could not read the Experience config", e); }
  return expCfgCache[site.key];
}

async function findMapWidgets(site) {
  const cfg = await getExpConfig(site);
  const found = Object.entries((cfg && cfg.widgets) || {})
    .filter(([, w]) => /arcgis-map\/?$/.test((w && (w.uri || (w.manifest && w.manifest.name))) || ""))
    .map(([id, w]) => { const u = (w.useDataSources || [])[0] || {}; return { id, ds: u.mainDataSourceId || u.dataSourceId || "" }; });
  if (site.map.widgetId) {
    return site.map.widgetId.split(",").map(x => x.trim()).filter(Boolean)
      .map(id => found.find(f => f.id === id) || { id, ds: "" });
  }
  return found.length ? found : [{ id: "map_1", ds: "" }];
}

// Work out the data source ID(s) of the parcel layer inside the app's web map.
// Both known ID shapes are returned (with and without the widget prefix); unknown IDs are simply ignored by the app.
const webMapCache = {};
async function parcelDataSourceIds(site, mapDs, widgetId) {
  if (site.map.dataSourceId) return site.map.dataSourceId.split(",").map(x => x.trim()).filter(Boolean);
  try {
    const cfg = await getExpConfig(site);
    const ds = cfg && cfg.dataSources && cfg.dataSources[mapDs];
    if (!ds || !ds.itemId) return [];
    const wm = webMapCache[ds.itemId] || (webMapCache[ds.itemId] = await getJSON(`${site.portal}/sharing/rest/content/items/${ds.itemId}/data?f=json`));
    const pl = await getLayer(site, "parcels");
    const norm = u => String(u || "").toLowerCase().replace(/\/$/, "");
    const hits = [];
    const walk = ls => (ls || []).forEach(l => {
      if ((l.url && norm(l.url) === norm(pl.url)) || (l.itemId && l.itemId === site.parcels.itemId)) hits.push(l.id);
      walk(l.layers);
    });
    walk(wm.operationalLayers);
    return hits.flatMap(id => [`${mapDs}-${id}`, `${widgetId}-${mapDs}-${id}`]);
  } catch (e) { console.warn("Could not work out the parcel data source ID", e); return []; }
}

async function buildExpUrl(site, upi, parcel, upiField) {
  const base = site.map.url.split(/[?#]/)[0].replace(/\/$/, "") + "/";
  const widgets = await findMapWidgets(site);
  const v = parcelView(parcel);
  const sel = site.map.select
    ? [...new Set((await Promise.all(widgets.map(w => parcelDataSourceIds(site, w.ds, w.id)))).flat())]
    : [];

  let val = `center:${enc(v.x.toFixed(2) + "," + v.y.toFixed(2) + ",102100")},scale:${v.scale}`;
  if (site.map.marker && !sel.length) val += `,marker:${enc(v.lon.toFixed(7) + "," + v.lat.toFixed(7) + ";;" + upi + ";" + upi)}`;
  const parts = widgets.map(w => `${w.id}=${val}`);
  if (sel.length) {
    const where = enc(`${upiField}='${upi.replace(/'/g, "''")}'`);
    parts.push("data_s=" + sel.map(id => `where:${id}:${where}`).join(","));
  }
  return base + "#" + parts.join("&");
}

/* ---- Web AppBuilder (Kigali) ---- */
const wabLayerCache = {};
async function getWabLayerId(site) {
  if (wabLayerCache[site.key] !== undefined) return wabLayerCache[site.key];
  if (site.map.layerId) return (wabLayerCache[site.key] = site.map.layerId);
  wabLayerCache[site.key] = "";
  try {
    const m = site.map.url.match(/[?&]id=([0-9a-f]{32})/i);
    if (!m) return "";
    const app = await getJSON(`${site.portal}/sharing/rest/content/items/${m[1]}/data?f=json`);
    const mapId = app && app.map && app.map.itemId;
    if (!mapId) return "";
    const wm = await getJSON(`${site.portal}/sharing/rest/content/items/${mapId}/data?f=json`);
    const pl = await getLayer(site, "parcels");
    const norm = u => String(u || "").toLowerCase().replace(/\/$/, "");
    const walk = ls => (ls || []).some(l => {
      if (l.url && norm(l.url) === norm(pl.url)) { wabLayerCache[site.key] = l.id; return true; }
      return walk(l.layers);
    });
    walk(wm.operationalLayers);
  } catch (e) { console.warn("Could not work out the parcel layer id in the app", e); }
  return wabLayerCache[site.key];
}

async function buildWabUrl(site, upi, parcel, upiField) {
  const base = site.map.url.split("#")[0];
  const sep = base.includes("?") ? "&" : "?";
  const layerId = site.map.select ? await getWabLayerId(site) : "";
  if (layerId) return `${base}${sep}query=${enc(layerId)},${enc(upiField)},${enc(upi)}`;   // WAB zooms to and highlights the feature
  const v = parcelView(parcel);
  let url = `${base}${sep}center=${v.x.toFixed(2)},${v.y.toFixed(2)},102100&scale=${v.scale}`;
  if (site.map.marker) url += `&marker=${v.lon.toFixed(7)},${v.lat.toFixed(7)},4326,,${enc(upi)},${enc(upi)}`;
  return url;
}

async function buildMapUrl(site, upi, parcel, upiField) {
  const url = site.map.type === "wab" ? await buildWabUrl(site, upi, parcel, upiField) : await buildExpUrl(site, upi, parcel, upiField);
  console.info("Map link:", url);
  return url;
}

const fmt = n => n.toLocaleString(undefined, { maximumFractionDigits: 1 });
function render(site, upi, parcelArea, visible, parcelCount, hiddenCount, mapUrl, otherSites) {
  out.innerHTML =
    `<h2>UPI ${esc(upi)}</h2><div class="meta">${esc(site.name)} &middot; Parcel area ${fmt(parcelArea)} m²</div>` +
    visible.map(r => {
      const pct = r.a / parcelArea * 100;
      return `<div class="zone ${r.un ? "un" : ""}">
        <div class="top"><span>${esc(r.zone)}</span><span>${pct.toFixed(1)}%</span></div>
        ${r.use ? `<div class="sub">${esc(r.use)}</div>` : ""}
        <div class="sub">${fmt(r.a)} m²</div>
        <div class="bar"><i style="width:${Math.min(pct, 100)}%"></i></div></div>`;
    }).join("") +
    `<a class="mapbtn" href="${esc(mapUrl)}" target="${COMMON.target}" rel="noopener">View this parcel on the map</a>` +
    `<div class="note">Areas are calculated from the layer geometries and are indicative.` +
    `${parcelCount > 1 ? ` ${parcelCount} parcels share this UPI; the first is shown.` : ""}` +
    `${hiddenCount ? ` ${hiddenCount} tiny overlap(s) under ${COMMON.minPercent}% were ignored.` : ""}` +
    `${otherSites.length ? ` This UPI also exists in ${esc(otherSites.join(", "))}; ${esc(site.name)} is shown.` : ""}</div>`;
}

async function run() {
  const upi = $("upi").value.replace(/\\/g, "/").replace(/\s+/g, "");
  if (!upi) return show("err", "Enter a UPI to search.");
  go.disabled = true;
  show("msg", "Finding the parcel and checking the master plan…");
  try {
    // Pick the site(s) by UPI prefix; fall back to all sites if the UPI matches no known prefix
    const byPrefix = SITES.filter(s => s.upiPrefix && upi.startsWith(s.upiPrefix));
    const candidates = byPrefix.length ? byPrefix : SITES;
    const results = await Promise.allSettled(candidates.map(async site => {
      const layer = await getLayer(site, "parcels");
      const upiF = pickField(layer, site.upiField, `the ${site.name} parcel layer`);
      const p = await query(layer.url, {
        where: `${upiF}='${upi.replace(/'/g, "''")}'`,
        outFields: upiF,
        returnGeometry: "true"
      });
      return { site, upiF, p };
    }));
    const hits = results.filter(r => r.status === "fulfilled" && r.value.p.features.length).map(r => r.value);
    if (!hits.length) {
      const failed = results.map((r, i) => r.status === "rejected" ? `${candidates[i].name} (${r.reason.message})` : null).filter(Boolean);
      results.forEach(r => { if (r.status === "rejected") console.error(r.reason); });
      return show("err", `No parcel found for UPI <b>${esc(upi)}</b>. Check the number and try again.` +
        (failed.length ? `<br><br>Some areas could not be searched: ${esc(failed.join("; "))}` : ""));
    }
    const { site, upiF, p } = hits[0];
    const otherSites = hits.slice(1).map(h => h.site.name);

    const planLayer = await getLayer(site, "plan");
    const zoneF = pickField(planLayer, site.zoneField, `the ${site.name} zoning layer`);
    const useF = site.useField ? pickField(planLayer, site.useField, `the ${site.name} zoning layer`) : "";
    const outFields = [zoneF, useF].filter(Boolean).join(",");

    const parcel = asFeature(p.features[0].geometry);
    const parcelArea = area(parcel);
    if (!parcelArea) return show("err", "This parcel has no usable geometry.");
    const mapUrl = await buildMapUrl(site, upi, parcel, upiF);

    // Fast path: if one zone wholly contains the parcel, the answer is 100% and no geometry needs downloading
    const whole = await query(planLayer.url, {
      where: "1=1",
      geometry: JSON.stringify(toEsriPolygon(p.features[0].geometry)),
      geometryType: "esriGeometryPolygon",
      inSR: "4326",
      spatialRel: "esriSpatialRelContains",
      outFields,
      returnGeometry: "false"
    });
    if (whole.features.length === 1) {
      const pr = whole.features[0].properties;
      return render(site, upi, parcelArea, [{ zone: pr[zoneF] ?? "Unspecified", use: useF ? (pr[useF] ?? "") : "", a: parcelArea }], p.features.length, 0, mapUrl, otherSites);
    }

    show("msg", "Parcel spans several zones. Calculating percentages…");
    const plan = await fetchAllPlan(p.features[0].geometry, planLayer.url, outFields);
    if (!plan.length) return show("err", "The parcel was found, but no master plan zone covers it.");

    // Group fragments by zone + land use, merging fragments of the same zone
    const groups = new Map();
    const bb = turf.bbox(parcel);
    for (const f of plan) {
      const piece = safe(() => turf.intersect(turf.featureCollection([parcel, turf.bboxClip(asFeature(f.geometry), bb)])));
      if (!piece) continue;
      const zone = f.properties[zoneF] ?? "Unspecified";
      const use = useF ? (f.properties[useF] ?? "") : "";
      const key = zone + "|" + use;
      const g = groups.get(key) || { zone, use, geom: null };
      g.geom = union(g.geom, piece);
      groups.set(key, g);
    }

    // Subtract what earlier zones already claimed so overlapping zones never push the total above 100%
    let covered = null;
    const rows = [];
    for (const g of [...groups.values()].sort((a, b) => area(b.geom) - area(a.geom))) {
      const own = covered ? (safe(() => turf.difference(turf.featureCollection([g.geom, covered]))) ) : g.geom;
      const a = area(own);
      covered = union(covered, g.geom);
      if (a > 0) rows.push({ ...g, a });
    }

    const visible = rows.filter(r => r.a / parcelArea * 100 >= COMMON.minPercent);
    const hiddenCount = rows.length - visible.length;
    const usedArea = Math.min(area(covered), parcelArea);
    const unzoned = Math.max(parcelArea - usedArea, 0);
    if (unzoned / parcelArea * 100 >= COMMON.minPercent) visible.push({ zone: "Not covered by any zone", use: "", a: unzoned, un: true });
    render(site, upi, parcelArea, visible, p.features.length, hiddenCount, mapUrl, otherSites);
  } catch (e) {
    console.error(e);
    show("err", "Could not complete the search: " + esc(e.message) + ". Check that the layers are shared publicly.");
  } finally {
    go.disabled = false;
  }
}
</script>
</body>
</html>
